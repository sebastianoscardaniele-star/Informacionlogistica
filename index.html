<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sellers - Operadores Logísticos</title>
  <style>
    :root { --bg:#f6f7fb; --card:#fff; --text:#172033; --muted:#657089; --line:#dfe4ee; --brand:#172554; --brand2:#2563eb; --ok:#16a34a; }
    * { box-sizing:border-box; }
    body { margin:0; font-family: Arial, Helvetica, sans-serif; background:var(--bg); color:var(--text); }
    header { background:linear-gradient(135deg,var(--brand),var(--brand2)); color:white; padding:24px; }
    header h1 { margin:0 0 8px; font-size:26px; }
    header p { margin:0; opacity:.9; }
    .wrap { max-width:1280px; margin:0 auto; padding:20px; }
    .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
    button { border:0; border-radius:10px; padding:10px 14px; cursor:pointer; font-weight:700; }
    .tab { background:#e9eef8; color:#1f2a44; }
    .tab.active { background:var(--brand2); color:#fff; }
    .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
    .search { flex:1; min-width:260px; padding:12px 14px; border:1px solid var(--line); border-radius:12px; font-size:15px; }
    .primary { background:var(--brand2); color:#fff; }
    .secondary { background:#e8ecf5; color:#1f2a44; }
    .layout { display:grid; grid-template-columns: 360px 1fr; gap:16px; }
    .panel { background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:0 8px 24px rgba(17,24,39,.06); overflow:hidden; }
    .list { max-height:72vh; overflow:auto; }
    .seller-row { padding:12px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
    .seller-row:hover, .seller-row.active { background:#eef5ff; }
    .seller-name { font-weight:800; margin-bottom:4px; }
    .seller-sub { color:var(--muted); font-size:13px; }
    .editor { padding:18px; max-height:72vh; overflow:auto; }
    .section { border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; background:#fff; }
    .section h2 { font-size:17px; margin:0 0 12px; }
    .grid { display:grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap:12px; }
    label { display:block; font-size:12px; font-weight:800; color:#334155; margin-bottom:5px; }
    input, select, textarea { width:100%; border:1px solid var(--line); border-radius:10px; padding:10px; font-size:14px; background:white; }
    textarea { min-height:90px; resize:vertical; }
    .checks { display:grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap:10px; }
    .check { display:flex; align-items:center; gap:8px; padding:10px; border:1px solid var(--line); border-radius:10px; }
    .check input { width:auto; }
    .empty { padding:30px; color:var(--muted); text-align:center; }
    .count { color:var(--muted); font-size:13px; margin-left:auto; }
    @media (max-width:900px) { .layout { grid-template-columns:1fr; } .grid,.checks { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<header><div class="wrap"><h1>Gestión de Sellers</h1><p>Datos editables por tienda, operadores logísticos, forma de envío, configuración y depósito.</p></div></header>
<main class="wrap">
  <div id="tabs" class="tabs"></div>
  <div class="toolbar">
    <input id="search" class="search" placeholder="Buscar por razón social, alias, CUIT o mail..." />
    <button class="primary" onclick="addSeller()">+ Agregar seller</button>
    <button class="secondary" onclick="exportXLSX()">Exportar XLSX</button>
    <button class="secondary" onclick="resetInitialData()">Restaurar datos iniciales</button>
    <span id="count" class="count"></span>
  </div>
  <div class="layout">
    <div class="panel list" id="list"></div>
    <div class="panel editor" id="editor"></div>
  </div>
</main>

    <div class="section"><h2>Retiro por sucursal</h2><label>Direcciones</label><textarea oninput="setValue('retiroPorSucursal', this.value)">${esc(s.retiroPorSucursal||'')}</textarea></div>
    <button class="secondary" onclick="deleteSeller()">Eliminar seller</button>
  `;
}
function setValue(path, value) {
  const s=getSeller(); if(!s) return;
  const parts=path.split('.'); let o=s;
  while(parts.length>1) o=o[parts.shift()];
  o[parts[0]]=value;
  save(); renderList();
}
function addSeller() {
  const item={id:currentStore+'-'+Date.now(), datosSeller:{'Estado':'En Proceso','Responsable':'','Razón social':'Nuevo seller','Alias (Nombre de Fantasía)':'','CUIT  (vinculado en el contrato)':'','Mail (usuario) Módulo logístico':'','Contraseña Módulo logístico':''}, operadorLogistico:Object.fromEntries(LOG_OPS.map(x=>[x,false])), formaEnvio:Object.fromEntries(SHIP.map(x=>[x,false])), configuracionLogistica:Object.fromEntries(CONFIG.map(x=>[x,false])), datosDeposito:{Provincia:'',Localidad:''}, retiroPorSucursal:''};
  data[currentStore].unshift(item); selectedId=item.id; save(); render();
}
function deleteSeller() { if(!confirm('¿Eliminar este seller?')) return; data[currentStore]=data[currentStore].filter(s=>s.id!==selectedId); selectedId=(data[currentStore][0]&&data[currentStore][0].id)||null; save(); render(); }
function resetInitialData() { if(!confirm('¿Restaurar datos iniciales? Se perderán cambios locales.')) return; localStorage.removeItem(STORAGE_KEY); data=JSON.parse(JSON.stringify(INITIAL_DATA)); stores=Object.keys(data); currentStore=stores[0] || 'BNA'; selectedId=(data[currentStore]&&data[currentStore][0]&&data[currentStore][0].id)||null; render(); }
async function exportXLSX() {
  if(!window.XLSX) { await new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'; sc.onload=res; sc.onerror=rej; document.head.appendChild(sc); }).catch(()=>alert('No se pudo cargar el exportador XLSX. Revisá la conexión.')); }
  if(!window.XLSX) return;
  const wb=XLSX.utils.book_new();
  stores.forEach(store=>{
    const rows=(data[store]||[]).map(s=>Object.assign({}, s.datosSeller, s.operadorLogistico, s.formaEnvio, s.configuracionLogistica, s.datosDeposito, {'Retiro por sucursal - Direcciones':s.retiroPorSucursal||''}));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), store.substring(0,31));
  });
  XLSX.writeFile(wb, 'sellers-operadores-logisticos.xlsx');
}
function render() { renderTabs(); renderList(); renderEditor(); }
document.getElementById('search').addEventListener('input', renderList);
render();
</script>
</body></html>
